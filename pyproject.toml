[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlsfqed"
version = "0.1.0"
description = "Calibrated ML beam model, QED Monte Carlo surrogate and Bayesian inference for strong-field QED experiments"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Di Liu"}]
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "pandas", "pyarrow", "h5py",
  "scikit-learn", "lightgbm", "matplotlib", "emcee", "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.5", "pre-commit"]
demo = ["jupyterlab"]
app = ["streamlit>=1.50", "plotly>=5.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/mlsfqed"]

[tool.ruff]
line-length = 100
